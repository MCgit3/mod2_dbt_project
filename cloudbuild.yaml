substitutions:
  _PROJECT_ID: hale-badge-505304-j8
  _REGION: us-central1

  # This is overridden by each Cloud Build trigger
  #
  # dbt          -> dbt-code-trigger
  # notebook     -> notebook-trigger
  # streamlit    -> streamlit-trigger
  # shared-image -> shared-image-trigger
  _PIPELINE_MODE: "streamlit"


steps:

  # ============================================================
  # STEP 1 - BUILD THE SHARED DOCKER IMAGE
  #
  # The same image is used by:
  #   1. dbt-job
  #   2. notebook-run-job
  #   3. streamlit-dashboard
  # ============================================================

  - id: build-image
    name: "gcr.io/cloud-builders/docker"
    args:
      - "build"
      - "-t"
      - "gcr.io/$PROJECT_ID/dbt-runner:$BUILD_ID"
      - "-t"
      - "gcr.io/$PROJECT_ID/dbt-runner:latest"
      - "."


  # ============================================================
  # STEP 2 - PUSH BUILD-SPECIFIC IMAGE
  # ============================================================

  - id: push-build-image
    name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/dbt-runner:$BUILD_ID"


  # ============================================================
  # STEP 3 - PUSH LATEST IMAGE
  # ============================================================

  - id: push-latest-image
    name: "gcr.io/cloud-builders/docker"
    args:
      - "push"
      - "gcr.io/$PROJECT_ID/dbt-runner:latest"


  # ============================================================
  # STEP 4 - UPDATE DBT JOB IMAGE
  #
  # Needed when:
  #   dbt code changes
  #   OR Dockerfile/shared image changes
  # ============================================================

  - id: update-dbt-job
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [[ "${_PIPELINE_MODE}" == "dbt" || \
              "${_PIPELINE_MODE}" == "shared-image" ]]; then

          echo "========================================"
          echo "Updating dbt-job image"
          echo "========================================"

          gcloud run jobs update dbt-job \
            --image=gcr.io/$PROJECT_ID/dbt-runner:$BUILD_ID \
            --region=${_REGION}

        else
          echo "DBT job image update not required."
        fi


  # ============================================================
  # STEP 5 - RUN DBT JOB
  #
  # Runs ONLY for DBT pipeline changes.
  #
  # dbt-job itself runs:
  #
  #   dbt run && dbt test
  # ============================================================

  - id: run-dbt-job
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [[ "${_PIPELINE_MODE}" == "dbt" ]]; then

          echo "========================================"
          echo "Executing dbt-job"
          echo "========================================"

          gcloud run jobs execute dbt-job \
            --region=${_REGION} \
            --wait

        else
          echo "Skipping dbt-job execution."
        fi


  # ============================================================
  # STEP 6 - UPDATE NOTEBOOK JOB IMAGE
  #
  # Needed when:
  #   dbt code changes
  #   notebook changes
  #   Dockerfile/shared image changes
  # ============================================================

  - id: update-notebook-job
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [[ "${_PIPELINE_MODE}" == "dbt" || \
              "${_PIPELINE_MODE}" == "notebook" || \
              "${_PIPELINE_MODE}" == "shared-image" ]]; then

          echo "========================================"
          echo "Updating notebook-run-job image"
          echo "========================================"

          gcloud run jobs update notebook-run-job \
            --image=gcr.io/$PROJECT_ID/dbt-runner:$BUILD_ID \
            --region=${_REGION}

        else
          echo "Notebook job image update not required."
        fi


  # ============================================================
  # STEP 7 - RUN NOTEBOOK
  #
  # Runs when:
  #   dbt changed
  #   OR notebook changed
  # ============================================================

  - id: run-notebook-job
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [[ "${_PIPELINE_MODE}" == "dbt" || \
              "${_PIPELINE_MODE}" == "notebook" ]]; then

          echo "========================================"
          echo "Executing notebook-run-job"
          echo "========================================"

          gcloud run jobs execute notebook-run-job \
            --region=${_REGION} \
            --wait

        else
          echo "Skipping notebook execution."
        fi


  # ============================================================
  # STEP 8 - DEPLOY STREAMLIT
  #
  # Deploy when:
  #   dbt changed
  #   notebook changed
  #   app.py changed
  #   Dockerfile/shared image changed
  # ============================================================

  - id: deploy-streamlit
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [[ "${_PIPELINE_MODE}" == "dbt" || \
              "${_PIPELINE_MODE}" == "notebook" || \
              "${_PIPELINE_MODE}" == "streamlit" || \
              "${_PIPELINE_MODE}" == "shared-image" ]]; then

          echo "========================================"
          echo "Deploying Streamlit"
          echo "========================================"

          gcloud run deploy streamlit-dashboard \
            --image=gcr.io/$PROJECT_ID/dbt-runner:$BUILD_ID \
            --region=${_REGION} \
            --platform=managed \
            --allow-unauthenticated

        else
          echo "Skipping Streamlit deployment."
        fi


images:
  - "gcr.io/$PROJECT_ID/dbt-runner:$BUILD_ID"
  - "gcr.io/$PROJECT_ID/dbt-runner:latest"


options:
  logging: CLOUD_LOGGING_ONLY