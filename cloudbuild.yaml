substitutions:
  _PROJECT_ID: hale-badge-505304-j8
  _REGION: us-central1

  # This is overridden by each Cloud Build trigger
  #
  # dbt          -> dbt-code-trigger
  # notebook     -> notebook-trigger
  # streamlit    -> streamlit-trigger
  # shared-image -> shared-image-trigger
  # data         -> data-pipeline-trigger
  #
  _PIPELINE_MODE: "streamlit"


steps:

  # ============================================================
  # STEP 1 - BUILD THE SHARED DOCKER IMAGE
  #
  # The same image is used by:
  #   1. dbt-job
  #   2. notebook-run-job
  #   3. streamlit-dashboard
  #
  # Image build is required only when code/image changes.
  # It is NOT required when only new Kaggle data arrives.
  # ============================================================

  - id: build-image
    name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [[ "${_PIPELINE_MODE}" == "data" ]]; then
          echo "========================================"
          echo "New data mode - skipping Docker build"
          echo "========================================"
        else
          echo "========================================"
          echo "Building shared Docker image"
          echo "========================================"

          docker build \
            -t gcr.io/$PROJECT_ID/dbt-runner:$BUILD_ID \
            -t gcr.io/$PROJECT_ID/dbt-runner:latest \
            .
        fi


  # ============================================================
  # STEP 2 - PUSH BUILD-SPECIFIC IMAGE
  #
  # Skip when only new data arrives.
  # ============================================================

  - id: push-build-image
    name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [[ "${_PIPELINE_MODE}" == "data" ]]; then
          echo "Skipping build-specific image push."

        else
          echo "========================================"
          echo "Pushing build-specific image"
          echo "========================================"

          docker push \
            gcr.io/$PROJECT_ID/dbt-runner:$BUILD_ID
        fi


  # ============================================================
  # STEP 3 - PUSH LATEST IMAGE
  #
  # Skip when only new data arrives.
  # ============================================================

  - id: push-latest-image
    name: "gcr.io/cloud-builders/docker"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [[ "${_PIPELINE_MODE}" == "data" ]]; then
          echo "Skipping latest image push."

        else
          echo "========================================"
          echo "Pushing latest image"
          echo "========================================"

          docker push \
            gcr.io/$PROJECT_ID/dbt-runner:latest
        fi


  # ============================================================
  # STEP 4 - UPDATE DBT JOB IMAGE
  #
  # Needed when:
  #   dbt code changes
  #   OR Dockerfile/shared image changes
  #
  # NOT needed when new data arrives.
  # ============================================================

  - id: update-dbt-job
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [[ "${_PIPELINE_MODE}" == "dbt" || \
              "${_PIPELINE_MODE}" == "shared-image" ]]; then

          echo "========================================"
          echo "Updating dbt-job image"
          echo "========================================"

          gcloud run jobs update dbt-job \
            --image=gcr.io/$PROJECT_ID/dbt-runner:$BUILD_ID \
            --region=${_REGION}

        else
          echo "DBT job image update not required."
        fi


  # ============================================================
  # STEP 5 - RUN DBT JOB
  #
  # Run when:
  #   dbt code changes
  #   OR new source data arrives
  #
  # dbt-job itself runs:
  #
  #   dbt run && dbt test
  # ============================================================

  - id: run-dbt-job
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [[ "${_PIPELINE_MODE}" == "dbt" || \
              "${_PIPELINE_MODE}" == "data" ]]; then

          echo "========================================"
          echo "Executing dbt-job"
          echo "Pipeline mode: ${_PIPELINE_MODE}"
          echo "========================================"

          gcloud run jobs execute dbt-job \
            --region=${_REGION} \
            --wait

        else
          echo "Skipping dbt-job execution."
        fi


  # ============================================================
  # STEP 6 - UPDATE NOTEBOOK JOB IMAGE
  #
  # Needed when:
  #   dbt code changes
  #   notebook changes
  #   Dockerfile/shared image changes
  #
  # NOT needed when new data arrives.
  # ============================================================

  - id: update-notebook-job
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [[ "${_PIPELINE_MODE}" == "dbt" || \
              "${_PIPELINE_MODE}" == "notebook" || \
              "${_PIPELINE_MODE}" == "shared-image" ]]; then

          echo "========================================"
          echo "Updating notebook-run-job image"
          echo "========================================"

          gcloud run jobs update notebook-run-job \
            --image=gcr.io/$PROJECT_ID/dbt-runner:$BUILD_ID \
            --region=${_REGION}

        else
          echo "Notebook job image update not required."
        fi


  # ============================================================
  # STEP 7 - RUN NOTEBOOK JOB
  #
  # Run when:
  #   dbt changed
  #   notebook changed
  #   OR new data arrives
  # ============================================================

  - id: run-notebook-job
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [[ "${_PIPELINE_MODE}" == "dbt" || \
              "${_PIPELINE_MODE}" == "notebook" || \
              "${_PIPELINE_MODE}" == "data" ]]; then

          echo "========================================"
          echo "Executing notebook-run-job"
          echo "Pipeline mode: ${_PIPELINE_MODE}"
          echo "========================================"

          gcloud run jobs execute notebook-run-job \
            --region=${_REGION} \
            --wait

        else
          echo "Skipping notebook execution."
        fi


  # ============================================================
  # STEP 8 - DEPLOY STREAMLIT
  #
  # Deploy when:
  #   dbt changed
  #   notebook changed
  #   app.py changed
  #   Dockerfile/shared image changed
  #
  # NOT needed when only data changes.
  # ============================================================

  - id: deploy-streamlit
    name: "gcr.io/cloud-builders/gcloud"
    entrypoint: "bash"
    args:
      - "-c"
      - |
        if [[ "${_PIPELINE_MODE}" == "dbt" || \
              "${_PIPELINE_MODE}" == "notebook" || \
              "${_PIPELINE_MODE}" == "streamlit" || \
              "${_PIPELINE_MODE}" == "shared-image" ]]; then

          echo "========================================"
          echo "Deploying Streamlit"
          echo "Pipeline mode: ${_PIPELINE_MODE}"
          echo "========================================"

          gcloud run deploy streamlit-dashboard \
            --image=gcr.io/$PROJECT_ID/dbt-runner:$BUILD_ID \
            --region=${_REGION} \
            --platform=managed \
            --allow-unauthenticated

        else
          echo "Skipping Streamlit deployment."
        fi

options:
  logging: CLOUD_LOGGING_ONLY