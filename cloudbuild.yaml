steps:
  # Step 1: Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/dbt-runner', '.']

  # Step 2: Push image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/dbt-runner']

  # Step 3: Update Cloud Run Job
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'update'
      - 'dbt-job'
      - '--image=gcr.io/$PROJECT_ID/dbt-runner'
      - '--region=us-central1'
      - '--service-account=dbt-runner@${PROJECT_ID}.iam.gserviceaccount.com'

  # Step 4: Execute Cloud Run Job
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'jobs'
      - 'execute'
      - 'dbt-job'
      - '--region=us-central1'

images:
  - 'gcr.io/$PROJECT_ID/dbt-runner'

options:
  logging: CLOUD_LOGGING_ONLY
